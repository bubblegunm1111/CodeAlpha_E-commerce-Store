<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Collection | SYS Royal Essence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar fouc-hidden" style="border-bottom: 1px solid var(--border-red); background-color: var(--bg-dark); position: sticky; top: 0; z-index: 100;">
        <div class="logo">
            <svg width="30" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 17h18v2H3z"/><path d="M4 15l2.5-8 3.5 4 2-6 2 6 3.5-4L20 15z"/>
            </svg>
            <span>SYS | ROYAL ESSENCE</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">SHOP</a>
            <a href="index.html#categories">COLLECTIONS</a>
            <a href="story.html">OUR STORY</a>
        </nav>
                <div class="nav-icons">
            <a href="#" class="nav-icon" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </a>
            <a href="#" class="nav-icon" aria-label="Wishlist">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78v0z"/></svg>
                <span class="badge" id="nav-wishlist">0</span>
            </a>
            <a href="#" class="nav-icon" aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                <span class="badge" id="nav-bag">0</span>
            </a>
        </div>
    </header>

    <main class="store-page">
        <div class="store-hero">
            <div class="breadcrumb">Home / Jewelry</div>
            <div class="hero-content">
                <div class="kicker"><span class="line"></span> THE <span class="line"></span></div>
                <h1 class="store-title">JEWELRY COLLECTION</h1>
                <p class="store-subtitle">Timeless pieces, designed for the royal spirit.</p>
            </div>
        </div>

        <div class="filters-bar">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="search-input" placeholder="Search by name...">
            </div>
            
            <div class="filter-dropdowns">
                <div class="dropdown">
                    <label>PRICE</label>
                    <select id="price-filter">
                        <option value="all">All Prices</option>
                        <option value="under-5000">Under $5,000</option>
                        <option value="over-5000">$5,000 & Above</option>
                    </select>
                </div>
                <div class="dropdown">
                    <label>CATEGORY</label>
                    <select id="cat-filter">
                        <option value="all">All Jewelry</option>
                        <option value="ring">Rings</option>
                        <option value="necklace">Necklaces</option>
                        <option value="bracelet">Bracelets</option>
                        <option value="earring">Earrings</option>
                    </select>
                </div>
                <div class="dropdown">
                    <label>MATERIAL</label>
                    <select id="material-filter">
                        <option value="all">All</option>
                        <option value="gold">Gold</option>
                        <option value="platinum">Platinum</option>
                    </select>
                </div>
                <div class="dropdown">
                    <label>GEMSTONE</label>
                    <select id="gem-filter">
                        <option value="all">All</option>
                        <option value="diamond">Diamond</option>
                        <option value="ruby">Ruby</option>
                        <option value="emerald">Emerald</option>
                    </select>
                </div>
                <div class="dropdown">
                    <label>SORT BY</label>
                    <select id="sort-filter">
                        <option value="featured">Featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
            </div>
            
            <button id="clear-filters" class="clear-btn">CLEAR ALL</button>
        </div>

        <div class="store-layout">
            <div class="results-count" id="results-count">24 PIECES</div>
            <section class="products-grid" id="products-grid">
                <!-- Products dynamically injected here via jewelry.js -->
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>gsap.set(".fouc-hidden", { visibility: "visible", opacity: 1 });</script>
    <script src="js/db.js"></script>
    <script src="js/jewelry.js"></script>
</body>
</html>
